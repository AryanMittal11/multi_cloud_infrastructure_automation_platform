# ==============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Express Backend Control Plane API (Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: multicloud-backend
    runtime: docker
    dockerfilePath: ./backend.Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false
      - key: RUN_SEED
        value: "false"
      - fromGroup: multicloud-shared-env

  # ----------------------------------------------------------------------------
  # 2. Terraform Worker (Background Worker)
  # ----------------------------------------------------------------------------
  - type: worker
    name: multicloud-worker
    runtime: docker
    dockerfilePath: ./worker.Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: multicloud-shared-env

# ------------------------------------------------------------------------------
# Shared Environment Variables Group (Shared by Backend & Worker)
# ------------------------------------------------------------------------------
envVarGroups:
  - name: multicloud-shared-env
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
